<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeopardy Trivia Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>JEOPARDY!</h1>
            <div class="score-container">
                <button class="score-btn minus" id="minusBtn">−</button>
                <span class="score" id="score">$0</span>
                <button class="score-btn plus" id="plusBtn">+</button>
            </div>
        </header>

        <div class="board" id="board">
            <!-- Board will be generated by JavaScript -->
        </div>
    </div>

    <!-- Modal for questions and answers -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="category-name" id="modalCategory"></span>
                <span class="dollar-value" id="modalValue"></span>
            </div>
            <div class="modal-body">
                <div class="question-text" id="questionText"></div>
                <div class="answer-text" id="answerText" style="display: none;"></div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn" id="showAnswerBtn">Show Answer</button>
                <button class="modal-btn" id="closeModalBtn" style="display: none;">Close</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
<!-- 
If you want to add a chat box that can open (pop up) on your Jeopardy page, you can use the following code. This adds a floating chat icon. When clicked, it opens a chat window. Click again (or close) to hide.

You will also need the associated CSS and (optionally) enhancements in your script.js if you want a more advanced chat, but here's the basic HTML and JS:

Place this before </body>.
-->

<!-- Chat Box Trigger Button -->
<div id="chatIcon" style="
    position: fixed;
    bottom: 32px;
    right: 32px;
    background: #2494e3;
    color: #fff;
    border-radius: 50%;
    width: 56px;
    height: 56px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    font-size: 32px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    z-index: 1000;
">
    💬
</div>

<!-- Chat Box Popup -->
<div id="chatBox" style="
    display: none;
    position: fixed;
    bottom: 100px;
    right: 32px;
    width: 300px;
    height: 350px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.26);
    z-index: 1001;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid #2494e3;
">
    <div style="background:#2494e3; color:#fff; padding:12px; display:flex; justify-content:space-between; align-items:center;">
        <span>Chat</span>
        <button id="closeChat" style="background:none; border:none; color:#fff; font-size:19px; cursor:pointer;">✖</button>
    </div>
    <div id="chatMessages" style="flex:1; padding:12px; overflow-y:auto; font-size:14px;"></div>
    <form id="chatForm" style="display:flex; border-top:1px solid #eee;">
        <input id="chatInput" type="text" placeholder="Type a message..." style="flex:1; padding:10px; border:none; outline:none;">
        <button type="submit" style="background:#2494e3; color:#fff; border:none; padding:0 16px; cursor:pointer;">Send</button>
    </form>
</div>

<script>
    // Chat open/close functionality
    const chatIcon = document.getElementById('chatIcon');
    const chatBox = document.getElementById('chatBox');
    const closeChat = document.getElementById('closeChat');
    chatIcon.onclick = function() {
        chatBox.style.display = chatBox.style.display === 'none' ? 'flex' : 'none';
    }
    closeChat.onclick = function() {
        chatBox.style.display = 'none';
    }

    // Optional: handle basic sending of chat messages (locally for demo)
    document.getElementById('chatForm').onsubmit = function(e) {
        e.preventDefault();
        const input = document.getElementById('chatInput');
        const messages = document.getElementById('chatMessages');
        if(input.value.trim()) {
            const div = document.createElement('div');
            div.textContent = input.value.trim();
            div.style.marginBottom = '8px';
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            input.value = '';
        }
    }
</script>
